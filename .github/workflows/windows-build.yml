name: windows-build

# Только ручной запуск: Actions -> windows-build -> Run workflow.
# Тяжёлый Gecko-билд не должен срабатывать на каждый push.
on:
  workflow_dispatch:
    inputs:
      clean:
        description: "Сбросить engine/ и скачать Firefox заново (игнорировать кеш исходников)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  AER_RELEASE: "1"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # Быстрая проверка без 40GB движка: Bun + TS 7 + патчи
  ui-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Restore Bun cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Typecheck (TS 7.0.2)
        run: bunx tsc --noEmit
      - name: UI check
        run: bun run lint

  # Полный билд Gecko — только вручную. Кеши слоёные, см. комментарии.
  build-windows:
    needs: ui-check
    # windows-2022 зафиксирован намеренно: там VS2022, под который заточен
    # MozillaBuild + Firefox 157. windows-2025/latest уже на VS2026.
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"

      - name: Setup Rust (Firefox 157)
        uses: dtolnay/rust-toolchain@stable

      # Главный кеш инкрементальной сборки: объектные файлы компилятора.
      # Сам складывается в GHA cache, путь указывать не надо.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Restore Bun cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Реестр cargo: ускоряет bootstrap и сборку Rust-частей движка.
      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-ff157-${{ hashFiles('surfer.json') }}
          restore-keys: cargo-${{ runner.os }}-ff157-

      # Исходники Firefox: кешируем engine/ без obj-*.
      # Артефакты сборки (obj-*) туда осознанно не входят: они десятки ГБ,
      # в лимит GHA cache (10GB) не влезут — их покрывает sccache выше.
      - name: Restore Firefox source cache
        uses: actions/cache@v5
        with:
          path: |
            engine
            !engine/obj-*
          key: ff-source-157-${{ hashFiles('surfer.json', 'build/firefox-cache/l10n-last-commit-hash') }}

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Reset engine (clean run)
        if: inputs.clean == true
        run: bun run reset-ff

      # Surfer делает `git add -f .` внутри engine/; дефолтный autocrlf=true
      # на Windows-раннере топит лог тысячами варнингов и портит LF в исходниках.
      - name: Force LF line endings for engine sources
        run: git config --global core.autocrlf false

      - name: Download + import
        run: bun run init
        env:
          MOZBUILD_PATH: "C:\\mozilla-build"

      - name: Build
        run: bun run build

      - name: Package
        run: bun run package

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: aer-browser-windows
          path: |
            engine/obj-*/dist/install/**/*.zip
            engine/obj-*/dist/*.zip
          if-no-files-found: warn
